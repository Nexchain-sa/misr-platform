services:
  - type: web
    name: misr-platform
    runtime: python
    plan: free               # الخطة المجانية
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
    # ملاحظة: الخطة المجانية لا تدعم القرص الدائم.
    # قاعدة البيانات (misr_platform.db) تُنشأ تلقائيًا مع البيانات النموذجية عند كل تشغيل،
    # وتُمسح عند إعادة التشغيل/التحديث/الخمول — مناسبة للتجربة والعرض.
    # للحفظ الدائم لاحقًا: ارفع الخطة إلى Starter وأضف disk + DATA_DIR=/var/data.
